<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Recognition</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;text-align:center;padding:16px;margin:0}
img{max-width:100%;max-height:300px;border-radius:12px;margin:12px 0}
li{list-style:none;margin:6px 0}
</style>
</head>
<body>
<h2>Tasveer Pehchano</h2>
<p id="st">Model load ho raha hai...</p>
<input type="file" id="f" accept="image/*" disabled><br>
<img id="im">
<ul id="out" style="padding:0"></ul>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1"></script>
<script>
let m;
mobilenet.load().then(x=>{m=x;st.textContent="Tayyar! Tasveer chunein";f.disabled=false});
f.onchange=()=>{
 im.onload=async()=>{
  out.innerHTML="Dekh raha hoon...";
  const r=await m.classify(im,5);
  out.innerHTML=r.map(p=>"<li>"+p.className+" - "+Math.round(p.probability*100)+"%</li>").join("");
 };
 im.src=URL.createObjectURL(f.files[0]);
};
</script>
</body>
</html>
