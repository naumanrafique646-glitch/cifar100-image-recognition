<!DOCTYPE html>
<html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasveer Pehchano</title>
<style>body{font-family:sans-serif;background:#111;color:#eee;text-align:center;padding:16px;margin:0}img{max-width:100%;max-height:300px;border-radius:12px;margin:12px 0}#out{white-space:pre-wrap;text-align:left;max-width:600px;margin:auto;line-height:1.6}button{margin:8px;padding:10px 16px;border-radius:8px;border:0;background:#2a5;color:#fff;font-size:15px}#tx{width:85%;max-width:500px;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;font-size:15px}#box{display:none;margin-top:12px}</style></head>
<body><h2>Tasveer Pehchano</h2>
<p id="st">v7: page khula, script ka intezar...</p>
<script>
window.onerror=function(m,s,l){window.dead=true;var e=document.getElementById("st");e.textContent="JS ghalti: "+m+" (line "+l+")";e.style.color="#f66"};
window.addEventListener("unhandledrejection",function(ev){window.dead=true;var e=document.getElementById("st");e.textContent="Wada toota: "+((ev.reason&&ev.reason.message)||ev.reason);e.style.color="#f66"});
</script>
<input type="file" id="f" accept="image/*"><br><img id="im"><div id="out"></div><div id="cf" style="margin-top:10px;color:#9cf"></div>
<div id="box">
<button id="bt">Ghalat hai? Gemini se dobara poocho</button><br>
<input id="tx" placeholder="Ya khud sahi jawab likho"><br>
<button id="sv">Ye yaad kar lo</button>
</div>
<script>
st.textContent="v7: script chal gayi";
const W="https://fancy-night-5d70.0naumanali98.workers.dev";
const TH=0.97,Q=3000;
const K="NoMi-12nAuMAn345";
const CN="apple aquarium_fish baby bear beaver bed bee beetle bicycle bottle bowl boy bridge bus butterfly camel can castle caterpillar cattle chair chimpanzee clock cloud cockroach couch crab crocodile cup dinosaur dolphin elephant flatfish forest fox girl hamster house kangaroo keyboard lamp lawn_mower leopard lion lizard lobster man maple_tree motorcycle mountain mouse mushroom oak_tree orange orchid otter palm_tree pear pickup_truck pine_tree plain plate poppy porcupine possum rabbit raccoon ray road rocket rose sea seal shark shrew skunk skyscraper snail snake spider squirrel streetcar sunflower sweet_pepper table tank telephone television tiger tractor train trout tulip turtle wardrobe whale willow_tree wolf woman worm".split(" ");
let cif=null;
let net=null,mem=[],err=false,note="",cur=null,curH=null;
const t0=Date.now();
const tick=setInterval(()=>{if(!net&&!err&&!window.dead)st.textContent="v7: model load ho raha hai... "+Math.round((Date.now()-t0)/1000)+" second. Tasveer abhi chun sakte hain, Gemini kaam karega."+note},1000);
function ld(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("file download nahi hui"));document.head.appendChild(s)})}
async function init(){
try{const r=await fetch(W);const tx2=await r.text();
mem=tx2.split("\n").filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);}
catch(e){note=" (Yaadasht nahi mili: "+e.message+")"}
try{
await ld("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0");
await ld("https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1");
await tf.setBackend("cpu");await tf.ready();
net=await mobilenet.load();
try{cif=await tf.loadGraphModel("cifar_model/model.json")}catch(e){note+=" (CIFAR model nahi mila)"}
clearInterval(tick);
st.textContent="Tayyar! Yaadasht mein "+mem.length+" tasveerein hain"+note;
}catch(e){err=true;clearInterval(tick);
st.textContent="Model load nahi hua ("+e.message+"). Gemini phir bhi kaam karega."+note;}
}
init();
function emb(img){return tf.tidy(()=>{const e=net.infer(img,true);const n=e.div(e.norm());return Array.from(n.dataSync()).map(v=>Math.round(v*Q))})}
async function hsh(file){const b=await file.arrayBuffer();const d=await crypto.subtle.digest("SHA-256",b);return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,"0")).join("")}
function cp(img){const h=img.naturalHeight,w=img.naturalWidth,s=Math.min(h,w),c=document.createElement("canvas");c.width=c.height=32;const g=c.getContext("2d");g.imageSmoothingQuality="high";g.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,32,32);return tf.tidy(()=>{const p=cif.predict(tf.browser.fromPixels(c).toFloat().expandDims(0));return Array.from(p.dataSync())})}function cos(a,b){let d=0,x=0,y=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];x+=a[i]*a[i];y+=b[i]*b[i]}return d/Math.sqrt(x*y+1e-9)}
async function save(e,t,h){
try{const r=await fetch(W+"/save",{method:"POST",headers:{"Content-Type":"application/json","x-token":K},body:JSON.stringify({e:e,t:t,h:h})});const j=await r.json();return j.ok?"ho gaya":"nahi hua (server ne mana kiya)"}
catch(x){return "nahi hua ("+x.message+")"}
}
f.onchange=async()=>{const file=f.files[0];if(!file)return;box.style.display="none";cur=null;out.textContent="Dekh raha hoon...";curH=await hsh(file);im.src=URL.createObjectURL(file)};im.onload=()=>run(false);
bt.onclick=()=>run(true);
sv.onclick=async()=>{
const t=tx.value.trim();
if(!cur){out.textContent="Yaad karne ke liye model ka load hona zaroori hai. Thori der ruko aur tasveer dobara chuno.";return}
if(!t)return;
mem.push({e:cur,h:curH,t:t});
out.textContent=t+"\n\n(Save ho raha hai...)";
const s=await save(cur,t,curH);
out.textContent=t+"\n\n(Tumhara jawab, yaadasht save: "+s+")";
tx.value="";
};
async function run(force){
let e=null,best=0,ans=null,hit=null;
cf.textContent="";if(cif){try{const q=cp(im).map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).slice(0,3);cf.textContent="CIFAR-100: "+q.map(x=>CN[x[1]].replace(/_/g," ")+" "+Math.round(x[0]*100)+"%").join(", ")}catch(x){cf.textContent="CIFAR error: "+x.message}}
if(!force&&curH){for(const m of mem){if(m.h===curH)hit=m.t}}
if(net){try{e=emb(im);cur=e;for(const m of mem){const sc=cos(e,m.e);if(sc>=best){best=sc;ans=m.t}}}catch(x){e=null}}
if(hit){out.textContent=hit+"\n\n(Yaadasht se, bilkul wohi tasveer)";box.style.display="block";return}
if(!force&&e&&ans&&best>=TH){out.textContent=ans+"\n\n(Yaadasht se, mushabihat "+Math.round(best*100)+"%)";box.style.display="block";return}
out.textContent="Gemini se pooch raha hoon...";
const s=Math.min(1,1024/Math.max(im.naturalWidth,im.naturalHeight));
const c=document.createElement("canvas");
c.width=im.naturalWidth*s;c.height=im.naturalHeight*s;
c.getContext("2d").drawImage(im,0,0,c.width,c.height);
const data=c.toDataURL("image/jpeg",0.85).split(",")[1];
try{
const r=await fetch(W,{method:"POST",headers:{"Content-Type":"application/json","x-token":K},body:JSON.stringify({image:data,mime:"image/jpeg"})});const j=await r.json();
const base=j.text+"\n\n(Gemini se)";
out.textContent=base;
if(!j.ok){out.textContent=base+"\n(Ye jawab yaad nahi kiya, Gemini masroof tha)"}
else if(!e){out.textContent=base+"\n(Yaad nahi kiya: model load nahi hua)"}
else{
mem.push({e:e,h:curH,t:j.text});
out.textContent=base+"\n(Save ho raha hai...)";
const st2=await save(e,j.text,curH);
out.textContent=base+"\n(Yaadasht save: "+st2+")";
}
}catch(x){out.textContent="Masla: "+x.message}
box.style.display="block";
}
</script></body></html>
