<!DOCTYPE html>
<html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasveer Pehchano</title>
<style>body{font-family:sans-serif;background:#111;color:#eee;text-align:center;padding:16px;margin:0}img{max-width:100%;max-height:300px;border-radius:12px;margin:12px 0}#out{white-space:pre-wrap;text-align:left;max-width:600px;margin:auto;line-height:1.6}</style></head>
<body><h2>Tasveer Pehchano</h2>
<input type="file" id="f" accept="image/*"><br><img id="im"><div id="out"></div>
<script>
const WURL="https://fancy-night-5d70.0naumanali98.workers.dev";
f.onchange=()=>{
const file=f.files[0];if(!file)return;
im.src=URL.createObjectURL(file);
out.textContent="Dekh raha hoon...";
const img=new Image();
img.onload=async()=>{
const s=Math.min(1,1024/Math.max(img.width,img.height));
const c=document.createElement("canvas");
c.width=img.width*s;c.height=img.height*s;
c.getContext("2d").drawImage(img,0,0,c.width,c.height);
const data=c.toDataURL("image/jpeg",0.85).split(",")[1];
try{
const r=await fetch(WURL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:data,mime:"image/jpeg"})});
const j=await r.json();
out.textContent=j.text;
}catch(e){out.textContent="Masla: "+e.message}
};
img.src=im.src;
};
</script></body></html>
